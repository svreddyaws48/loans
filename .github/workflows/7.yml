name: Workflow-7
on: workflow_dispatch
jobs:    
  job1:
    runs-on: ubuntu-latest
    steps:
    - name: install Docker
      run: |
         curl -fsSL https://get.docker.com -o install-docker.sh
         sudo sh install-docker.sh       
    - name: Docker login
      run: |
         docker login -u ${{vars.DOCKER_USER}} -p ${{ secrets.DOCKER_PASSWD }}
    